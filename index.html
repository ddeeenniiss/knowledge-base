<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Knowledge Base</title>

    <!-- Markdown Renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  </head>

  <body>
    <nav>
      <h3>Navigation</h3>
      <ul>
        <!-- wird von buildNav gefüllt -->
      </ul>
    </nav>

    <div class="content">
      <h2>Willkommen!</h2>
      <p>Wähle links ein Thema aus, um die Markdown-Dateien und Live-Demos zu sehen.</p>
      <p>Neue Dateien werden automatisch zur Navigation hinzugefügt.</p>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const content = document.querySelector(".content");

        async function loadFile(path) {
          try {
            const res = await fetch(path);
            if (!res.ok) throw new Error("Datei nicht gefunden");

            const text = await res.text();

            if (path.endsWith(".md")) {
              content.innerHTML = marked.parse(text);
            } else if (path.endsWith(".html")) {
              content.innerHTML = text;
            } else {
              content.innerHTML = "<p style='color:red;'>Unbekannter Dateityp</p>";
            }
          } catch (err) {
            content.innerHTML = "<p style='color:red;'>Fehler: " + err.message + "</p>";
          }
        }

        async function buildNav() {
          const res = await fetch("structure.json");
          const data = await res.json();
          const nav = document.querySelector("nav ul");
          nav.innerHTML = "";

          function addItems(obj, parent) {
            for (const key in obj) {
              const li = document.createElement("li");

              if (typeof obj[key] === "string") {
                const a = document.createElement("a");
                a.textContent = key;
                a.href = "#" + obj[key];
                a.onclick = (e) => {
                  e.preventDefault();
                  window.location.hash = obj[key];
                  loadFile(obj[key]);
                };
                li.appendChild(a);
              } else {
                const folder = document.createElement("strong");
                folder.textContent = key;
                li.appendChild(folder);

                const subUl = document.createElement("ul");
                subUl.style.paddingLeft = "15px";
                addItems(obj[key], subUl);
                li.appendChild(subUl);
              }

              parent.appendChild(li);
            }
          }

          addItems(data, nav);
        }

        function loadFromHash() {
          const hash = window.location.hash.slice(1);
          if (hash) loadFile(hash);
        }

        window.addEventListener("hashchange", loadFromHash);

        buildNav().then(loadFromHash);
      });
    </script>

    <!-- Vite Entry -->
    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
